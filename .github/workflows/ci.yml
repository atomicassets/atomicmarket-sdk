name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Prewarm yarn cache for the git dependency
        # yarn v1 builds the @atomichub/atomicassets git dependency in a nested
        # install that races the outer fetch on a cold cache and corrupts it
        # (yarn forwards no mutex to the nested process). Installing the
        # dependency's package set serially first turns the nested install into
        # pure cache reads. The clone URL and ref are derived from the
        # dependency spec in package.json so the two cannot drift; the step
        # self-skips once the dependency moves to the published npm version.
        run: |
          SPEC="$(node -p '(require("./package.json").dependencies ?? {})["@atomichub/atomicassets"] ?? ""')"
          case "$SPEC" in
            git+*|git:*)
              URL="${SPEC#git+}"
              REF="${URL#*#}"
              URL="${URL%%#*}"
              git clone --depth 1 -b "$REF" "$URL" /tmp/prewarm-atomicassets
              cd /tmp/prewarm-atomicassets
              yarn install --frozen-lockfile
              ;;
            *)
              echo "No git dependency to prewarm"
              ;;
          esac

      - name: Install
        run: yarn install --frozen-lockfile

      # Type-checks src and the test tree. tsconfig.json excludes the test
      # tree so that tsup emits declarations for src alone, so this needs the
      # dedicated tsconfig.test.json to cover what that one doesn't.
      - name: Type check
        run: yarn run check-types

      - name: Build
        run: yarn run build

      - name: Lint
        run: yarn run lint

      - name: Test
        run: yarn run test

      - name: Release notes script
        run: bash scripts/release-notes.test.sh
